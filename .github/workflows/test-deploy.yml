# ⚠ 의도적으로 취약한 GitHub Actions 워크플로. Checkov github_actions 탐지 검증용.
# 실제 프로덕션에 배포 금지.

name: deploy-insecure-sample

on:
  push:
    branches: [main]
  pull_request_target:   # ← CKV2_GHA_2: pull_request_target 사용 위험
    types: [opened, synchronize]

# ── CKV2_GHA_1: top-level write-all ──────────────────
permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ── CKV_GHA_1: 3rd-party action 을 태그로만 참조 (SHA 미사용) ────
      - uses: actions/checkout@v2
      - uses: aws-actions/configure-aws-credentials@v1
      - uses: some-random-user/custom-action@main   # ← 검증되지 않은 외부 action

      # ── CKV_GHA_2: 스크립트에 ${{ }} expression 직접 삽입 (shell injection) ──
      - name: Greet user
        run: |
          echo "Hello ${{ github.event.pull_request.title }}"   # ← 제3자 입력 직접 삽입

      - name: Process PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "body = ${{ github.event.pull_request.body }}"  # ← 다시 expression 삽입

      # ── CKV_GHA_3: exec 로 untrusted input 실행 ──────────
      - name: Execute dynamic
        run: |
          bash -c "${{ github.event.issue.title }}"   # ← 제목이 bash 로 실행됨 (RCE)

      # ── secrets 를 3rd-party action에 직접 전달 ─────────
      - name: Leak secrets to external action
        uses: some-random-user/deploy-action@v1
        with:
          aws-key:    ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          slack-token: ${{ secrets.SLACK_TOKEN }}

      # ── 체크아웃 후 PR 코드 실행 (pull_request_target 과 결합 시 RCE) ──
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run PR scripts
        run: npm install && npm run build   # ← 악의적 PR 의 스크립트가 실행됨

      # ── SSH debug action (secrets 가 tmate 세션에 노출 위험) ──
      - name: Debug with tmate
        if: failure()
        uses: mxschmitt/action-tmate@v3

      # ── 하드코딩된 민감값 ───────────────────────────
      - name: Hardcoded creds
        env:
          API_KEY: "AKIAIOSFODNN7EXAMPLE"
          DB_PASS: "HardcodedPassword123!"
        run: echo "env set"
